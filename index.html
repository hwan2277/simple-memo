<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simple Memo | 나만의 메모장</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#142b28;background:#f0f5f1}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.app{width:min(100%,500px);background:#fff;border-radius:22px;box-shadow:0 16px 40px #1d453018;padding:32px}h1{margin:0 0 8px}.sub{color:#62736d;margin:0 0 25px}.field{display:block;margin:15px 0 6px;font-weight:600;font-size:14px}input,textarea{width:100%;border:1px solid #cad8d0;border-radius:10px;padding:13px;font:inherit}textarea{min-height:108px;resize:vertical}button{font:inherit;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;background:#216b4b;color:white;font-weight:650}button:disabled{opacity:.5;cursor:not-allowed}button.alt{background:#e8f1eb;color:#285b43}button.danger{background:#fff0ef;color:#9b3129}.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.status{font-size:14px;min-height:22px;color:#426850}.status.error{color:#aa2929}.memo{padding:15px 0;border-bottom:1px solid #e4eae6;display:flex;justify-content:space-between;align-items:start;gap:12px}.memo p{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}.memo time{display:block;color:#7b8f84;font-size:12px;margin-top:7px}header{display:flex;justify-content:space-between;align-items:start;gap:12px}#notes{margin-top:18px}small{color:#66786d}[hidden]{display:none!important}
</style></head><body><main class="app"><header><div><h1>Simple Memo</h1><p class="sub">안전하게 나만 보는 메모</p></div><button id="logout" class="alt" hidden>로그아웃</button></header><section id="auth"><label class="field" for="email">이메일</label><input id="email" type="email" autocomplete="username" placeholder="name@example.com"><label class="field" for="password">비밀번호 (6자 이상)</label><input id="password" type="password" autocomplete="current-password" minlength="6"><div class="actions"><button id="signin">로그인</button><button id="signup" class="alt">회원가입</button></div></section><section id="board" hidden><label class="field" for="body">새 메모</label><textarea id="body" maxlength="3000" placeholder="메모 내용을 입력하세요"></textarea><div class="actions"><button id="save">메모 저장</button></div><h2>내 메모</h2><div id="notes"></div></section><p id="message" class="status" role="status" aria-live="polite"></p></main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://otdzemizigpbdsvcqjwf.supabase.co','sb_publishable_-5bQ88180pari4w_T1Cm3Q_J82B5v9C',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id),msg=(text,error=false)=>{$('message').textContent=text;$('message').classList.toggle('error',error)};
async function refresh(){const {data:{user}}=await sb.auth.getUser();$('auth').hidden=!!user;$('board').hidden=!user;$('logout').hidden=!user;if(user)await list();}
async function work(action){const email=$('email').value.trim(),password=$('password').value;if(!email||password.length<6){msg('이메일과 6자 이상 비밀번호를 입력하세요.',true);return;}msg('처리 중...');const {error}=action==='signup'?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});if(error)msg(error.message,true);else{msg(action==='signup'?'가입 요청 완료. 이메일 인증이 필요할 수 있습니다.':'로그인 완료');await refresh();}}
$('signup').onclick=()=>work('signup');$('signin').onclick=()=>work('signin');$('logout').onclick=async()=>{const {error}=await sb.auth.signOut();msg(error?error.message:'로그아웃했습니다.',!!error);await refresh();};
$('save').onclick=async()=>{const content=$('body').value.trim();if(!content)return msg('메모를 입력하세요.',true);$('save').disabled=true;const {error}=await sb.from('memos').insert({content});$('save').disabled=false;if(error)msg('저장 실패: '+error.message,true);else{$('body').value='';msg('메모를 저장했습니다.');await list();}};
async function list(){const {data,error}=await sb.from('memos').select('id,content,created_at').order('created_at',{ascending:false});const el=$('notes');el.replaceChildren();if(error)return msg('조회 실패: '+error.message,true);if(!data.length){const p=document.createElement('small');p.textContent='아직 저장한 메모가 없습니다.';el.append(p);}for(const item of data){const r=document.createElement('article');r.className='memo';const t=document.createElement('div'),p=document.createElement('p'),stamp=document.createElement('time'),del=document.createElement('button');p.textContent=item.content;stamp.textContent=new Date(item.created_at).toLocaleString('ko-KR');del.textContent='삭제';del.className='danger';del.onclick=async()=>{if(!confirm('이 메모를 삭제할까요?'))return;del.disabled=true;const {error}=await sb.from('memos').delete().eq('id',item.id);msg(error?'삭제 실패: '+error.message:'메모를 삭제했습니다.',!!error);await list();};t.append(p,stamp);r.append(t,del);el.append(r);}}
sb.auth.onAuthStateChange(()=>{setTimeout(refresh,0)});await refresh();
</script></body></html>
