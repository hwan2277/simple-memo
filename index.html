<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#285c49"><title>Simple Memo 2.0</title><link rel="stylesheet" href="css/style.css"></head><body>
<aside><a class="brand" href="./">▧ <span>Simple Memo<small>작은 기록, 선명한 하루</small></span></a><button id="new" class="primary">＋ 새 메모</button><nav id="nav"></nav><div class="section-label">내 폴더 <button id="add-folder" aria-label="폴더 관리">＋</button></div><div id="folders"></div><button id="manage-tags" class="tag-manage">태그 관리</button><div class="aside-bottom"><span class="avatar">홍</span><div>나의 메모 공간<small id="identity">체험 모드 · 이 브라우저에 저장</small></div></div></aside>
<main><header><button id="menu" aria-label="메뉴 열기">☰</button><div><span class="eyebrow">YOUR PERSONAL WORKSPACE</span><h1 id="view-title">나의 기록</h1></div><button id="auth-button">계정 연결</button></header><div class="notice" id="mode">체험 모드입니다. 샘플 메모는 이 브라우저에만 저장되며 기존 계정의 메모와 분리됩니다.</div><section id="stats" class="stats"></section><div class="toolbar"><label class="search">⌕ <input id="search" placeholder="제목, 내용, 태그로 찾아보세요" aria-label="메모 검색"></label><select id="sort" aria-label="정렬"><option value="updated_at">최근 수정순</option><option value="created_at">최근 작성순</option><option value="title">제목순</option></select><button id="layout" aria-label="보기 방식 전환">▦</button></div><div class="workspace"><section id="list" aria-label="메모 목록"></section><section id="editor" hidden aria-label="메모 편집"></section></div><p id="status" role="status" aria-live="polite"></p><footer>기록해 두세요. 다음의 내가 고마워할 거예요.</footer></main>
<dialog id="auth-dialog"><form id="login"><h2>나만의 기록에 로그인</h2><p>기존 이메일 링크 인증을 그대로 사용합니다.</p><label>이메일<input id="email" type="email" required autocomplete="email"></label><button class="primary">로그인 링크 받기</button><button type="button" id="close-auth">닫기</button><p id="auth-status" role="status"></p></form></dialog><script type="module" src="js/app.js"></script></body></html>
